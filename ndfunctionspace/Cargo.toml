[features]
strict = []
mpi = ["dep:mpi", "ndelement/mpi", "ndmesh/mpi"]


[package]
name = "ndfunctionspace"
version = "0.4.0-dev"
edition = "2024"
authors = [
    "Matthew Scroggs <rust@mscroggs.co.uk>",
]
description = "Finite element function spaces."
license = "BSD-3-Clause"
homepage = "https://codeberg.org/nd-project/nd"
repository = "https://codeberg.org/nd-project/nd"
readme = "README.md"
keywords = ["numerics"]
categories = ["mathematics", "science"]

[lib]
name = "ndfunctionspace"
crate-type = ["lib"]

[dependencies]
ndelement = { path = "../ndelement" }
ndmesh = { path = "../ndmesh" }
itertools = "0.14.*"
mpi = { version = "0.8.2", optional = true }
rlst = "0.6"
num = "0.4"

[dev-dependencies]
quadraturerules = "0.9.1"
approx = "0.5"
rlst = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
blas-src = { version = "0.14", features = ["accelerate"]}
lapack-src = { version = "0.13", features = ["accelerate"]}

[target.'cfg(target_os = "linux")'.dev-dependencies]
openblas-src = { version = "0.10", features = ["system"]}
lapack-src = { version = "0.13", features = ["openblas"]}
blas-src = { version = "0.14", features = ["openblas"] }

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = [ "--html-in-header", "katex-header.html" ]

[lints.clippy]
wildcard_imports = "forbid"

[[example]]
name = "test_parallel_space"
required-features = ["mpi"]

[package.metadata.example.test_parallel_space.templated-examples]
command = "mpirun -n {{NPROCESSES}}"
