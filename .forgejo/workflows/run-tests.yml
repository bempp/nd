name: Testing

on: [pull_request]

jobs:
  rust-unit-tests:
    name: Rust unit tests (${{ matrix.feature-flags }})
    runs-on: docker
    strategy:
      matrix:
        rust-version: ["stable"]
        mpi: ["openmpi"]
        feature-flags:
          - '--no-default-features --features "strict"'
          - '--features "strict"'
          - '--all-features'
    steps:
      - name: Set up Rust
        uses: https://github.com/dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust-version }}
      - name: Set up MPI
        uses: https://github.com/mpi4py/setup-mpi@v1
        with:
          mpi: ${{ matrix.mpi }}
      - uses: actions/checkout@v6
      - name: apt-get update
        run: sudo apt-get update
      - name: Install clang cmake
        run: sudo apt-get install -y libclang-dev cmake
      - name: Install LAPACK, OpenBLAS, SCOTCH
        run: sudo apt-get install -y libopenblas-dev liblapack-dev libscotch-dev

      - name: Run unit tests
        run: cargo test ${{ matrix.feature-flags }}

  rust:
    name: Rust tests and examples
    runs-on: docker
    strategy:
      matrix:
        rust-version: ["stable"]
        mpi: ["openmpi"]
    steps:
      - name: Set up Rust
        uses: https://github.com/dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust-version }}
      - name: Set up MPI
        uses: https://github.com/mpi4py/setup-mpi@v1
        with:
          mpi: ${{ matrix.mpi }}
      - name: Install cargo-mpirun and cargo-templated-examples
        run: cargo install cargo-mpirun cargo-templated-examples
      - uses: actions/checkout@v6
      - name: apt-get update
        run: sudo apt-get update
      - name: Install clang cmake
        run: sudo apt-get install -y libclang-dev cmake
      - name: Install LAPACK, OpenBLAS, SCOTCH
        run: sudo apt-get install -y libopenblas-dev liblapack-dev libscotch-dev

      - name: Run tests
        run: cargo test --examples --release --features "strict"

      - name: Run examples
        run: |
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          cargo templated-examples NPROCESSES 4

  python:
    name: Python tests (${{ matrix.python-version}})
    runs-on: docker
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Set up Rust
        uses: https://github.com/dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
      - name: Set up Python
        uses: https://github.com/actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v6
      - name: apt-get update
        run: sudo apt-get update
      - name: Install clang cmake
        run: sudo apt-get install -y libclang-dev cmake
      - name: Install LAPACK, OpenBLAS, SCOTCH
        run: sudo apt-get install -y libopenblas-dev liblapack-dev libscotch-dev
      - name: Install uv
        run: pip install uv "maturin>=1.7"

      - name: Make virtual environment for ndelement
        run: |
          cd ndelement-python
          uv venv .venv --python ${{ matrix.python-version }}

      - name: Run Rust tests for ndelement-python
        run: |
          cd ndelement-python
          source .venv/bin/activate
          cargo test --features "strict"

      - name: Install ndelement Python package
        run: |
          cd ndelement-python
          source .venv/bin/activate
          maturin develop --release
      - name: Run ndelement Python tests
        run: |
          cd ndelement-python
          source .venv/bin/activate
          python -m pytest python/test
