[features]
mpi = ["ndelement/mpi"]
serde = ["ndelement/serde"]
strict = []
default = ["serde"]

[package]
name = "ndelement-python"
version = "0.4.0-dev"
edition = "2024"
authors = ["Matthew Scroggs <rust@mscroggs.co.uk>"]
description = "Python extension for ndelement."
license = "BSD-3-Clause"
homepage = "https://codeberg.org/nd-project/nd"
repository = "https://codeberg.org/nd-project/nd"
readme = "README.md"
keywords = ["numerics", "finite-elements", "python"]
categories = ["mathematics", "science"]

[lib]
name = "ndelement"
crate-type = ["cdylib"]

[dependencies]
ndelement = { path = "../ndelement" }
rlst = "0.6"
pyo3 = "0.29.2"
numpy = "0.29"

[target.'cfg(target_os = "macos")'.dependencies]
blas-src = { version = "0.14", features = ["accelerate"] }
lapack-src = { version = "0.13", features = ["accelerate"] }

[target.'cfg(target_os = "linux")'.dependencies]
openblas-src = { version = "0.10", features = ["system"] }
lapack-src = { version = "0.13", features = ["openblas"] }
blas-src = { version = "0.14", features = ["openblas"] }

[lints.clippy]
wildcard_imports = "forbid"
